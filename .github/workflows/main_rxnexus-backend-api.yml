name: Build and deploy Python app to Azure Web App - rxnexus-backend-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies and build SPA
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package application to zip
        run: |
          zip -r release.zip . -x "antenv/*" "frontend/node_modules/*" "frontend/src/*" "frontend/venv/*" "frontend.zip" ".venv/*" "venv/*" "node_modules/*" ".git/*" "*.pyc" "__pycache__/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./deploy-package
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E06C4FAD452B4947AB97129BA553325C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_414B83BD8B714FB299507D95D105141F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6CE5C870B81244B280D2D3CB1AB95F65 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'rxnexus-backend-api'
          slot-name: 'Production'
          package: './deploy-package/release.zip'